<svg viewBox="0 0 700 560" xmlns="http://www.w3.org/2000/svg" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="700" height="560" fill="#ffffff"/>

  <!-- Actor -->
  <g stroke="#1a1a1a" stroke-width="2" fill="none">
    <circle cx="55" cy="230" r="14" fill="#ffffff"/>
    <line x1="55" y1="244" x2="55" y2="290"/>
    <line x1="30" y1="260" x2="80" y2="260"/>
    <line x1="55" y1="290" x2="35" y2="325"/>
    <line x1="55" y1="290" x2="75" y2="325"/>
  </g>
  <text x="55" y="345" text-anchor="middle" font-size="13" fill="#1a1a1a">User</text>

  <!-- Use case ellipses -->
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.5">
    <ellipse cx="300" cy="40"  rx="105" ry="30"/>
    <ellipse cx="300" cy="115" rx="105" ry="30"/>
    <ellipse cx="300" cy="190" rx="105" ry="30"/>
    <ellipse cx="300" cy="265" rx="105" ry="30"/>
    <ellipse cx="300" cy="340" rx="105" ry="30"/>
    <ellipse cx="300" cy="415" rx="105" ry="30"/>
    <ellipse cx="300" cy="490" rx="105" ry="30"/>
    <ellipse cx="590" cy="340" rx="90" ry="30"/>
  </g>

  <g font-size="13" fill="#1a1a1a" text-anchor="middle">
    <text x="300" y="45">Register/Login</text>
    <text x="300" y="120">Logout</text>
    <text x="300" y="195">Plan tour</text>
    <text x="300" y="270">Log tour</text>
    <text x="300" y="345">View past tours</text>
    <text x="300" y="420">Import/export data</text>
    <text x="300" y="495">Statistics</text>
    <text x="590" y="345">Download/share</text>
  </g>

  <!-- Actor associations -->
  <g stroke="#1a1a1a" stroke-width="1.3" fill="none">
    <path d="M55,230 C120,150 150,60 195,42"/>
    <path d="M55,230 C120,180 160,130 195,117"/>
    <path d="M55,230 C120,215 165,195 195,192"/>
    <path d="M55,240 C130,250 170,265 195,266"/>
    <path d="M55,250 C130,290 175,330 195,339"/>
    <path d="M55,260 C130,340 175,400 195,414"/>
    <path d="M55,265 C130,380 190,470 195,489"/>
  </g>

  <!-- include relationship -->
  <line x1="405" y1="340" x2="495" y2="340" stroke="#1a1a1a" stroke-width="1.3" stroke-dasharray="6,4" marker-end="url(#arrow)"/>
  <text x="450" y="330" text-anchor="middle" font-size="11" fill="#1a1a1a">&lt;&lt;include&gt;&gt;</text>

  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#1a1a1a"/>
    </marker>
  </defs>
</svg>
