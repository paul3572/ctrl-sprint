name: tourplanner-dev

services:
  postgres:
    image: postgres:17-alpine
    container_name: tourplanner-postgres-dev
    restart: unless-stopped

    env_file:
      - ./cts.core.db.tourplanner/runtime/secrets/postgres.dev.secrets

    ports:
      - "5433:5432"

    volumes:
      - ./cts.core.db.tourplanner/runtime/postgres-dev:/var/lib/postgresql/data
      - ./cts.core.db.tourplanner/postgres/init:/docker-entrypoint-initdb.d:ro
      - ./cts.core.db.tourplanner/backup/dev:/backup

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - tourplanner-dev

  api:
    build:
      context: ./cts.core.api.tourplanner
      dockerfile: Dockerfile

    image: tourplanner-api:dev
    container_name: tourplanner-api-dev
    restart: unless-stopped
    init: true

    env_file:
      - ./cts.core.db.tourplanner/runtime/secrets/api.dev.secrets

    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_HTTP_PORTS: "8080"

    ports:
      - "4321:8080"

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - tourplanner-dev

networks:
  tourplanner-dev:
    name: tourplanner-dev